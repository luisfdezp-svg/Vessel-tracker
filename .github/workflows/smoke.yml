name: Smoke checks

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run smoke checks
        run: python scripts/smoke_checks.py
