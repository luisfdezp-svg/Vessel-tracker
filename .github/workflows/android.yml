name: Build Android APK

on:
  push:
    branches: [ main, 'claude/**' ]
    paths:
      - 'android-app/**'
      - 'Groupage-offline.html'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      release:
        description: 'Crear release en GitHub'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync Groupage-offline.html a assets
        shell: bash
        run: |
          cp ../Groupage-offline.html app/src/main/assets/groupage.html
          ls -la app/src/main/assets/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Install Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build release APK
        env:
          SIGNING_KEYSTORE: ${{ github.workspace }}/android-app/keystore/release.jks
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD || 'groupage2026' }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS || 'groupage' }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD || 'groupage2026' }}
        run: |
          gradle --version
          gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/Groupage-$(date +%Y%m%d)-v1.0.0.apk
          ls -la out/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Groupage-APK
          path: android-app/out/*.apk
          if-no-files-found: error

      - name: Crear release (solo con workflow_dispatch + release=true)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Groupage APK build ${{ github.run_number }}
          files: android-app/out/*.apk
          body: |
            APK firmado del Groupage Optimizer.
            Commit: ${{ github.sha }}
            Instalación: Android 8.0+ (API 26). En el móvil,
            Ajustes → Apps → Instalar apps desconocidas → tu navegador → permitir.
