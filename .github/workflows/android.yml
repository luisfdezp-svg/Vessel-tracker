name: Build Android APK

on:
  push:
    branches: [ main, 'claude/**' ]
    paths:
      - 'android-app/**'
      - 'Groupage-offline.html'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      release:
        description: 'Crear release en GitHub'
        required: false
        type: boolean
        default: false
      version_name:
        description: 'VersionName opcional (ej: 1.3.0)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync Groupage-offline.html a assets
        shell: bash
        run: |
          cp ../Groupage-offline.html app/src/main/assets/groupage.html
          ls -la app/src/main/assets/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Validar secretos de firma
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          test -n "$SIGNING_KEYSTORE_BASE64" || { echo "Falta secret SIGNING_KEYSTORE_BASE64"; exit 1; }
          test -n "$SIGNING_KEYSTORE_PASSWORD" || { echo "Falta secret SIGNING_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$SIGNING_KEY_ALIAS" || { echo "Falta secret SIGNING_KEY_ALIAS"; exit 1; }
          test -n "$SIGNING_KEY_PASSWORD" || { echo "Falta secret SIGNING_KEY_PASSWORD"; exit 1; }

      - name: Preparar keystore temporal
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks" || { echo "Keystore vacío o inválido"; exit 1; }

      - name: Build release APK
        env:
          SIGNING_KEYSTORE: ${{ runner.temp }}/release.jks
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.event.inputs.version_name != '' && github.event.inputs.version_name || format('1.0.{0}', github.run_number) }}
        run: |
          chmod +x ./gradlew
          ./gradlew --version
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        env:
          VERSION_NAME: ${{ github.event.inputs.version_name != '' && github.event.inputs.version_name || format('1.0.{0}', github.run_number) }}
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/Groupage-$(date +%Y%m%d)-v${VERSION_NAME}.apk
          ls -la out/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Groupage-APK
          path: android-app/out/*.apk
          if-no-files-found: error

      - name: Cleanup keystore temporal
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Crear release (solo con workflow_dispatch + release=true)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Groupage APK build ${{ github.run_number }}
          files: android-app/out/*.apk
          body: |
            APK firmado del Groupage Optimizer.
            Commit: ${{ github.sha }}
            Instalación: Android 8.0+ (API 26). En el móvil,
            Ajustes → Apps → Instalar apps desconocidas → tu navegador → permitir.
