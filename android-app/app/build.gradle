plugins {
    id 'com.android.application'
}

def envOrNull = { String key ->
    def value = System.getenv(key)
    return (value == null || value.trim().isEmpty()) ? null : value.trim()
}

def signingKeystore = envOrNull("SIGNING_KEYSTORE")
def signingStorePassword = envOrNull("SIGNING_KEYSTORE_PASSWORD")
def signingKeyAlias = envOrNull("SIGNING_KEY_ALIAS")
def signingKeyPassword = envOrNull("SIGNING_KEY_PASSWORD")
def hasReleaseSigning = [signingKeystore, signingStorePassword, signingKeyAlias, signingKeyPassword].every { it != null }
def defaultVersionCode = 1

android {
    namespace 'com.luisfdezp.groupage'
    compileSdk 34

    defaultConfig {
        applicationId "com.luisfdezp.groupage"
        minSdk 26
        targetSdk 34
        versionCode (envOrNull("VERSION_CODE") ?: defaultVersionCode.toString()).toInteger()
        versionName envOrNull("VERSION_NAME") ?: "1.0.0-dev"
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(signingKeystore)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
        }
        release {
            minifyEnabled false
            shrinkResources false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    gradle.taskGraph.whenReady { graph ->
        def releaseRequested = graph.allTasks.any { t -> t.name.toLowerCase().contains('release') }
        if (releaseRequested && !hasReleaseSigning) {
            throw new GradleException("Release build requires signing env vars: SIGNING_KEYSTORE, SIGNING_KEYSTORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD")
        }
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES','META-INF/LICENSE','META-INF/NOTICE']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.10.0'
}
