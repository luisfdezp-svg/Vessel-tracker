<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VTrack">
<title>Vessel Tracker Pro</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous" referrerpolicy="no-referrer"/>
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon.svg">
<meta name="theme-color" content="#0a0e17">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<link rel="stylesheet" href="./assets/css/vessel-tracker.css">
</head>
<body>
<div class="app">

<!-- SIDEBAR (Desktop) -->
<div class="sidebar">
  <div class="sb-head">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <div><h1>⚓ Vessel Tracker</h1><div style="font-size:9px;color:var(--dim)">AIS + Manual · <span id="sD">OFF</span></div></div>
      <span class="badge" id="sBD" style="background:#7f1d1d;color:var(--red)">OFF</span>
    </div>
  </div>
  <div class="sb-body" id="sbContent"></div>
</div>

<!-- MAP -->
<div id="map" style="flex:1"></div>

<!-- TOPBAR (Mobile) -->
<div class="topbar">
  <div><h1>⚓ Vessel Tracker</h1><div class="sub"><span id="sM">OFF</span></div></div>
  <span class="badge" id="sBM" style="background:#7f1d1d;color:var(--red)">OFF</span>
</div>

<!-- PANEL (Mobile) -->
<div class="panel min" id="panel">
  <div class="handle"></div>
  <div class="phead" onclick="togglePanel()"><h2>Panel</h2><span style="font-size:18px;color:var(--dim)" id="pChev">▾</span></div>
  <div class="pbody" id="mobileContent"></div>
</div>

</div>

<!-- SHARED CONTENT TEMPLATE -->
<template id="contentTpl">
<div class="tabs" id="mainTabs">
  <button class="tab on" onclick="sTab('cfg')">Config</button>
  <button class="tab" onclick="sTab('fleet')">Flota</button>
  <button class="tab" onclick="sTab('db')">BD</button>
  <button class="tab" onclick="sTab('email')">Email</button>
  <button class="tab" onclick="sTab('log')">Log</button>
</div>

<!-- CONFIG -->
<div id="tCfg">
  <div class="card">
    <div class="label">AISstream API Key</div>
    <input type="text" id="apikey" placeholder="API key (gratis en aisstream.io)" autocomplete="off" spellcheck="false">
  </div>
  <div class="card">
    <div class="label">Buques (<span id="vc">0</span>/20)</div>
    <div class="row">
      <input type="text" id="mmsiIn" placeholder="MMSI" inputmode="numeric" autocomplete="off">
      <input type="text" id="nameIn" placeholder="Nombre" autocomplete="off">
    </div>
    <button class="ba" onclick="addV()">+ Añadir</button>
    <div id="vList" style="max-height:180px;overflow-y:auto"></div>
  </div>
  <div class="card">
    <div class="label">📍 Posición manual</div>
    <select id="manMmsi"></select>
    <div class="row"><input type="text" id="manLat" placeholder="Lat" inputmode="decimal"><input type="text" id="manLon" placeholder="Lon" inputmode="decimal"></div>
    <div class="row"><input type="text" id="manSog" placeholder="SOG" inputmode="decimal"><input type="text" id="manCog" placeholder="COG" inputmode="decimal"></div>
    <button class="bw" onclick="manPos()">📍 Actualizar</button>
  </div>
  <div class="card">
    <div class="label">Geofence</div>
    <div class="row"><input type="text" id="gfLa" placeholder="Lat" inputmode="decimal"><input type="text" id="gfLo" placeholder="Lon" inputmode="decimal"></div>
    <div class="row"><input type="text" id="gfR" placeholder="Radio NM" inputmode="decimal"><input type="text" id="gfN" placeholder="Nombre"></div>
    <button class="by" onclick="addGF()">+ Geofence</button>
    <div id="gfList"></div>
  </div>
  <div class="card">
    <div class="setting-row"><span>Anchor Watch</span><div class="toggle" id="tAW" onclick="S.aw=!S.aw;syncT();saveCfg()"></div></div>
    <div class="setting-row"><span>Sonido</span><div class="toggle on" id="tSnd" onclick="S.snd=!S.snd;syncT();saveCfg()"></div></div>
    <div class="setting-row"><span>Auto-reconexión</span><div class="toggle on" id="tRec" onclick="S.rec=!S.rec;syncT();saveCfg()"></div></div>
    <div class="setting-row"><span>Notificaciones <span id="ntfSt" style="color:var(--dim);font-size:9px"></span></span><div class="toggle" id="tNtf" onclick="toggleNotif()"></div></div>
  </div>
  <div class="card" id="instCard" style="display:none">
    <div class="label">App</div>
    <button class="ba" onclick="doInstall()">📱 Instalar en pantalla de inicio</button>
  </div>
  <div class="row">
    <button class="bg" id="goBtn" onclick="conn()">▶ Conectar</button>
    <button class="br" id="stopBtn" onclick="disc()" style="display:none">■ Parar</button>
  </div>
  <button class="by" onclick="fitAll()">⊡ Ver todos los buques</button>
</div>

<!-- FLEET -->
<div id="tFleet" style="display:none"></div>

<!-- DATABASE -->
<div id="tDb" style="display:none">
  <div class="card">
    <div class="label">Registros de posición (auto cada 4h navegando)</div>
    <div style="font-size:9px;color:var(--dim);margin-bottom:6px">Amarrado/fondeado: registra inicio y fin</div>
    <div class="row">
      <button class="by" onclick="exportDb()">📥 Exportar CSV</button>
      <button class="by" onclick="if(confirm('¿Borrar todos los registros?')){DB=[];saveDb();rDb();}">🗑 Borrar</button>
    </div>
    <div style="max-height:250px;overflow:auto;margin-top:6px" id="dbTable"></div>
    <div style="font-size:9px;color:var(--dim);margin-top:4px" id="dbCount"></div>
  </div>
</div>

<!-- EMAIL -->
<div id="tEmail" style="display:none">
  <div class="card">
    <div class="label">Configuración EmailJS (envío automático)</div>
    <div style="font-size:9px;color:var(--dim);margin-bottom:6px">Regístrate gratis en emailjs.com (200 emails/mes)</div>
    <input type="text" id="ejPub" placeholder="Public Key (EmailJS)">
    <input type="text" id="ejSvc" placeholder="Service ID (ej: service_xxx)">
    <input type="text" id="ejTpl" placeholder="Template ID (ej: template_xxx)">
    <input type="text" id="ejTo" placeholder="Email destino" inputmode="email">
    <button class="by" onclick="testEmail()">📧 Enviar test</button>
  </div>
  <div class="card">
    <div class="label">Triggers de email</div>
    <div style="font-size:9px;color:var(--dim);margin-bottom:6px">Selecciona cuándo enviar notificación</div>
    <div class="setting-row"><span>Entrada/salida geofence</span><div class="toggle on" id="tEGeo" onclick="S.eGeo=!S.eGeo;syncT();saveCfg()"></div></div>
    <div class="setting-row"><span>Cambio velocidad &gt;3kn</span><div class="toggle" id="tESpd" onclick="S.eSpd=!S.eSpd;syncT();saveCfg()"></div></div>
    <div class="setting-row"><span>Cambio estado (nav↔fondeo)</span><div class="toggle on" id="tESt" onclick="S.eSt=!S.eSt;syncT();saveCfg()"></div></div>
    <div class="setting-row"><span>Deriva en fondeo</span><div class="toggle" id="tEAn" onclick="S.eAn=!S.eAn;syncT();saveCfg()"></div></div>
    <div class="setting-row"><span>Nuevo registro BD (4h)</span><div class="toggle" id="tEDb" onclick="S.eDb=!S.eDb;syncT();saveCfg()"></div></div>
  </div>
</div>

<!-- LOG -->
<div id="tLog" style="display:none">
  <div class="log-box" id="logBox"><span class="g">Listo</span></div>
  <button class="by" onclick="exportCSV()" style="margin-top:4px">Exportar posiciones CSV</button>
</div>
</template>

<script src="./assets/js/vessel-tracker.js" defer></script>
</body>
</html>
